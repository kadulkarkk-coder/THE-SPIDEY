name: Build WEBSTER Mark D

on:
  workflow_dispatch:
  push:
    paths:
      - 'WEBSTER_REFERENCE/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - '.github/workflows/build-webster.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Generate spider icon
        run: python packaging/windows/generate_icon.py

      - name: Build WEBSTER.exe
        run: pyinstaller --clean packaging/windows/WEBSTER.spec

      - name: Verify Windows executable
        shell: powershell
        run: |
          if (-not (Test-Path 'dist/WEBSTER.exe')) { throw 'WEBSTER.exe was not produced.' }
          Write-Host "WEBSTER.exe size: $((Get-Item 'dist/WEBSTER.exe').Length) bytes"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: WEBSTER-Windows
          path: dist/WEBSTER.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build WEBSTER APK
        working-directory: packaging/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Android APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WEBSTER-Android
          path: packaging/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
