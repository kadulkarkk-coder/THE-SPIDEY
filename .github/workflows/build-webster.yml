name: Build WEBSTER A+B+C Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'WEBSTER_REFERENCE/**'
      - 'packaging/windows/**'
      - 'requirements-build.txt'
      - '.github/workflows/build-webster.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Build A+B+C executable
        run: pyinstaller --clean packaging/windows/WEBSTER_ABC.spec
      - name: Verify Windows executable
        shell: powershell
        run: |
          if (-not (Test-Path 'dist/WEBSTER_ABC.exe')) { throw 'WEBSTER_ABC.exe was not produced.' }
          Write-Host "WEBSTER_ABC.exe size: $((Get-Item 'dist/WEBSTER_ABC.exe').Length) bytes"
      - name: Upload A+B+C executable
        uses: actions/upload-artifact@v4
        with:
          name: WEBSTER-A-B-C-Windows
          path: dist/WEBSTER_ABC.exe
          if-no-files-found: error
