plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.webster.markd'
    compileSdk 35

    defaultConfig {
        applicationId 'com.webster.markd'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.1.4'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    sourceSets {
        main {
            python.srcDir '../../../WEBSTER_REFERENCE'
        }
    }
}

chaquopy {
    defaultConfig {
        // WEBSTER core is standard-library based on Android. Desktop-only
        // OpenCV/Pillow dependencies are intentionally not installed here.
    }
}
