plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.webster.markd'
    compileSdk 35

    defaultConfig {
        applicationId 'com.webster.markd'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    sourceSets {
        main {
            python.srcDir '../../../WEBSTER_REFERENCE'
        }
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            install '-r', '../../../requirements.txt'
        }
    }
}
