plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.webster.markd'
    compileSdk 35

    defaultConfig {
        applicationId 'com.webster.markd'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
        ndk {
            // Chaquopy 17 supports arm64-v8a and x86_64 for the default runtime.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    sourceSets {
        main {
            python.srcDir '../../../WEBSTER_REFERENCE'
        }
    }
}

chaquopy {
    defaultConfig {
        // Use Chaquopy's default Python runtime to avoid requiring a host Python
        // version which may not be provisioned on the Android runner.
        pip {
            install '-r', '../../../requirements.txt'
        }
    }
}
